	<body class="ui-page ui-page-wardrobe">
		<div class='title ui-page-header' id="title">
			<a href="index.html">奇跡暖暖線上工具-正體中文版</a><br/>
			本頁面為衣櫃對比工具，配裝器、衣櫃錄入等功能請到上面的連結使用。<br/>
			<br/>
			使用說明：<br/>
			1）在配裝器完成衣櫃錄入後，重新整理本頁。（一定要重新整理網頁！）<br/>
			2）遊戲中點衣櫃，對比各分類擁有數量和此頁分類名稱後的數字是否一致。<br/>
			3）數字出現不同時，隨機選取該分類下本頁面左邊的某一位置，檢查此處衣服是否在遊戲衣櫃中也是左邊。如果同樣都是左邊，則該位置以前都是正確的；否則就是在該位置上方（比該衣服編號小的服裝中）少了一件。<br/>
		</div>
